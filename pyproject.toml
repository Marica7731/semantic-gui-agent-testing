[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-gui-agent-testing"
version = "0.1.0"
description = "Semantic GUI automation for LLM agents: Android and Windows executors with an MCP interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "semantic-gui-agent-testing contributors" }]
keywords = ["gui", "testing", "agent", "mcp", "uiautomator2", "pywinauto", "android", "windows"]

[project.optional-dependencies]
android = ["uiautomator2>=3.0"]
windows = ['pywinauto>=0.6.8; sys_platform == "win32"']
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Marica7731/semantic-gui-agent-testing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
